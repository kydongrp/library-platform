name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint and build
    runs-on: ubuntu-latest

    env:
      # `prisma generate` and `next build` both want a syntactically valid URL,
      # but neither opens a connection: every route is dynamic except
      # /_not-found, so nothing queries the database while building. Pointing at
      # a closed port is deliberate rather than lazy. It makes it impossible for
      # CI to reach a real database, and the build was verified against this
      # exact value before this workflow was committed.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/nodb
      POSTGRES_URL_NON_POOLING: postgresql://ci:ci@127.0.0.1:1/nodb
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@127.0.0.1:1/nodb

    steps:
      # Pinned to the v7.0.1 commit: a mutable tag is a supply-chain input.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 24.x is what the Vercel project builds on, so a green run here means the
      # same thing it will mean at deploy time.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # postinstall runs `prisma generate`. src/generated/prisma is gitignored,
      # so without this nothing can resolve @/generated/prisma.
      - name: Install
        run: npm ci

      # High-or-worse advisories fail the build. This will occasionally go red
      # through no fault of the diff, when a new advisory lands upstream; that
      # is the point of a patch-management gate.
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npx eslint . --max-warnings 0

      # Deliberately NOT `npm run build`. That script is
      # `prisma db push && tsx prisma/seed-if-empty.ts && next build`, and the
      # first two mutate a real database; Vercel runs those against production
      # at deploy time. CI compiles only. `next build` type-checks the whole
      # project against tsconfig, so this covers scripts/ and prisma/ as well.
      - name: Build
        run: npx next build

      # These three need no database: the modules under test are pure. They are
      # the guard on the timezone fix, and the reason the guard is in CI rather
      # than in a runbook is that the defect they cover was invisible on a
      # Singapore developer's laptop and only appeared on a UTC server.
      - name: Timezone primitives
        run: npm run test:tz

      - name: Due dates, open days and fines across the day boundary
        run: npm run test:calendar

      - name: No unzoned date handling outside the allowlist
        run: npm run test:tz:guard

      # House style. Asking for em dashes to be removed by hand did not make
      # them stop coming back, so it is a build failure now.
      - name: House style
        run: npm run test:style
